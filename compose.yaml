services:
  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-lab-keycloak-db}
    volumes: [keycloak-data:/var/lib/postgresql/data]
    networks: [identity-db]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --features=token-exchange-delegation,parameterized-scopes --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-lab-keycloak-db}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-lab-admin}
      KC_HOSTNAME: https://keycloak.localhost:8443
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [keycloak-db]
    networks: [identity-ui, identity-primary, identity-finance-agent, identity-finance-api, identity-management, identity-db]
  keycloak-declarations:
    image: quay.io/keycloak/keycloak:26.8.0
    entrypoint: ["/bin/bash", "/declarations/apply-declaration.sh"]
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-lab-admin}
    volumes:
      - ./keycloak:/declarations:ro
    depends_on: [keycloak]
    networks: [identity-management]
  keycloak-tls:
    image: caddy:2.11.7
    volumes:
      - ./keycloak/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local-certs:/certs:ro
    ports: ["127.0.0.1:8443:8443"]
    depends_on: [keycloak]
    networks:
      identity-ui:
        aliases: [keycloak.localhost]
      identity-finance-agent:
        aliases: [keycloak.localhost]
  finance-db:
    image: postgres:16
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD:-lab-finance-db}
    volumes:
      - finance-data:/var/lib/postgresql/data
      - ./db.sql:/docker-entrypoint-initdb.d/001-db.sql:ro
    networks: [data]
  finance-api:
    build:
      context: .
      dockerfile: Dockerfile.python
      args: {SERVICE: finance_api}
    environment:
      DATABASE_URL: postgresql://finance:${FINANCE_DB_PASSWORD:-lab-finance-db}@finance-db:5432/finance
      OIDC_ISSUER: https://keycloak.localhost:8443/realms/lab
      KEYCLOAK_INTERNAL: http://keycloak:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      finance-db: {condition: service_started}
      keycloak-declarations: {condition: service_completed_successfully}
    networks: [finance, data, identity-finance-api, telemetry-api]
  finance-agent:
    build:
      context: .
      dockerfile: Dockerfile.python
      args: {SERVICE: finance_agent}
    environment:
      FINANCE_CLIENT_SECRET: ${FINANCE_CLIENT_SECRET:-lab-finance-agent-secret}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OIDC_ISSUER: https://keycloak.localhost:8443/realms/lab
      KEYCLOAK_INTERNAL: http://keycloak:8080
      FINANCE_API_URL: http://finance-api:8000
      FINANCE_SESSION_DB: /sessions/finance.sqlite3
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - finance-sessions:/sessions
    depends_on: [finance-api]
    networks: [orchestration, finance, identity-finance-agent, telemetry-finance-agent]
  primary-agent:
    build:
      context: .
      dockerfile: Dockerfile.python
      args: {SERVICE: primary}
    environment:
      PRIMARY_CLIENT_SECRET: ${PRIMARY_CLIENT_SECRET:-lab-primary-secret}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OIDC_ISSUER: https://keycloak.localhost:8443/realms/lab
      KEYCLOAK_INTERNAL: http://keycloak:8080
      FINANCE_AGENT_URL: http://finance-agent:8000/a2a
      PRIMARY_AGENT_DESTINATIONS: ${PRIMARY_AGENT_DESTINATIONS:-}
      PRIMARY_SESSION_DB: /sessions/primary.sqlite3
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - primary-sessions:/sessions
    depends_on: [finance-agent]
    networks: [frontend, orchestration, identity-primary, telemetry-primary]
  librechat-db:
    image: mongo:8
    volumes: [librechat-data:/data/db]
    networks: [frontend]
  librechat:
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8@sha256:5b706bcee1ca154a1e2987303aaeca0eb27f97919cccee4bb604226c2f8abf61
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://librechat-db:27017/LibreChat
      DOMAIN_CLIENT: http://localhost:3080
      DOMAIN_SERVER: http://localhost:3080
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:-lab-change-this-jwt-secret-1234567890}
      JWT_REFRESH_SECRET: ${LIBRECHAT_REFRESH_SECRET:-lab-change-this-refresh-secret-1234567890}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:-0123456789abcdef0123456789abcdef}
      OPENID_ISSUER: https://keycloak.localhost:8443/realms/lab
      NODE_EXTRA_CA_CERTS: /certs/cert.pem
      OPENID_CLIENT_ID: librechat
      OPENID_CLIENT_SECRET: ${LIBRECHAT_CLIENT_SECRET:-lab-librechat-secret}
      OPENID_SESSION_SECRET: ${LIBRECHAT_OPENID_SESSION_SECRET:-lab-openid-session-secret-change-me}
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_SCOPE: "openid profile email primary-audience"
      OPENID_REUSE_TOKENS: "true"
      OPENID_AUTO_REDIRECT: "true"
      ALLOW_SOCIAL_LOGIN: "true"
      ALLOW_EMAIL_LOGIN: "false"
      ALLOW_REGISTRATION: "false"
      SCHEDULES_SINGLE_PROCESS: "true"
      CONFIG_PATH: /app/librechat.yaml
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat-app-data:/app/data
      - ./.local-certs:/certs:ro
    ports: ["127.0.0.1:3080:3080"]
    depends_on: [primary-agent, librechat-db, keycloak-tls]
    networks: [frontend, identity-ui]
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [telemetry-primary, telemetry-finance-agent, telemetry-api]
networks:
  frontend: {}
  orchestration: {}
  finance: {}
  data: {}
  identity-ui: {}
  identity-primary: {}
  identity-finance-agent: {}
  identity-finance-api: {}
  identity-management: {}
  identity-db: {}
  telemetry-primary: {}
  telemetry-finance-agent: {}
  telemetry-api: {}
volumes:
  keycloak-data: {}
  finance-data: {}
  librechat-data: {}
  librechat-app-data: {}
  primary-sessions: {}
  finance-sessions: {}
